spring:
  application:
    name: notification
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          max-retries: 5
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8088

servicios:
  usuarios-url: ${USUARIOS_URL:http://localhost:8082}

notificaciones:
  correo:
    habilitado: ${NOTIFICACIONES_CORREO_HABILITADO:true}
    remitente: ${MAIL_USERNAME}
    max-intentos: ${NOTIFICACIONES_CORREO_MAX_INTENTOS:5}
    lote: ${NOTIFICACIONES_CORREO_LOTE:20}
    intervalo-ms: ${NOTIFICACIONES_CORREO_INTERVALO_MS:15000}
  recordatorios:
    intervalo-ms: ${NOTIFICACIONES_RECORDATORIOS_INTERVALO_MS:60000}
